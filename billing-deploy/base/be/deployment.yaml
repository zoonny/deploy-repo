apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-be
  labels:
    app: billing-be
spec:
  # 노드 CPU 여유 확보를 위해 일시적으로 1 replica로 축소
  replicas: 1
  selector:
    matchLabels:
      app: billing-be
  template:
    metadata:
      labels:
        app: billing-be
    spec:
      containers:
        - name: billing-be
          image: ghcr.io/zoonny/billing/app
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: billing-be-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: billing-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-db-secret
                  key: POSTGRES_PASSWORD
            # 배포 프로파일(prod·dev)은 운영자 계정이 없으면 기동을 거부한다 (OPS-001 R2).
            # 시크릿은 커밋하지 않는다 — secret.example.yaml 참고.
            - name: BILLING_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: billing-admin-secret
                  key: BILLING_ADMIN_PASSWORD
          # 느린 기동(102초)을 startupProbe가 흡수하도록 추가.
          # 10s × 30회 = 최대 300초까지 기동 대기, 성공 시 liveness로 전환
          startupProbe:
            httpGet: 
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5           # 1초는 GC/부하 시 오탐 유발
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
