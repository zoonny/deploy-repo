# 템플릿 파일입니다. 실제 값으로 채워서 git에 커밋하지 마세요.
# 최초 배포 시 아래처럼 직접 클러스터에 적용하세요:
#
#   kubectl create secret generic billing-admin-secret -n billing \
#     --from-literal=BILLING_ADMIN_USERNAME=admin \
#     --from-literal=BILLING_ADMIN_PASSWORD='<실값>'
#
# BILLING_ADMIN_PASSWORD가 없으면 prod 프로파일은 기동을 거부한다 (OPS-001 R2).
# DB 시크릿과 분리한 이유: billing-db-secret은 postgres 컨테이너가 envFrom으로
# 통째로 가져간다 — 앱 관리자 비밀번호가 DB 컨테이너 환경에 섞이면 안 된다.
# 이 파일은 kustomization.yaml resources에 포함되어 있지 않습니다.
apiVersion: v1
kind: Secret
metadata:
  name: billing-admin-secret
type: Opaque
stringData:
  BILLING_ADMIN_USERNAME: admin
  BILLING_ADMIN_PASSWORD: CHANGE_ME
