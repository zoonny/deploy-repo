# 템플릿 파일입니다. 실제 값으로 채워서 git에 커밋하지 마세요.
# 최초 배포 시 아래처럼 직접 클러스터에 적용하세요:
#
#   kubectl create secret generic billing-db-secret -n billing \
#     --from-literal=POSTGRES_USER=billing \
#     --from-literal=POSTGRES_PASSWORD='<실값>' \
#     --from-literal=POSTGRES_DB=billing
#
# 이 파일은 kustomization.yaml resources에 포함되어 있지 않습니다.
apiVersion: v1
kind: Secret
metadata:
  name: billing-db-secret
type: Opaque
stringData:
  POSTGRES_USER: billing
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: billing
