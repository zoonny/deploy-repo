apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-db
  labels:
    app: billing-db
spec:
  serviceName: billing-db-service
  replicas: 1
  selector:
    matchLabels:
      app: billing-db
  template:
    metadata:
      labels:
        app: billing-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: billing-db-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: billing-db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              # $(VAR)는 probe의 exec.command에서 치환되지 않는다(컨테이너
              # command/args에만 적용) — 리터럴 문자열이 그대로 전달된다.
              # docker-compose.prod.yml의 healthcheck와 같은 형태로 맞춘다.
              command: ["pg_isready", "-U", "billing", "-d", "billing"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "billing", "-d", "billing"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: billing-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 10Gi
